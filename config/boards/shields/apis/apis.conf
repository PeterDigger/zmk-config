# Enable ZMK USB HID Keyboard functionality
CONFIG_ZMK_USB=y

# Disable CDC ACM serial logging (Prevents boot stalls when no serial console is attached)
CONFIG_USB_CDC_ACM=n

# Disable deep sleep to keep the USB PHY awake
CONFIG_ZMK_SLEEP=n

# Ensure USB polling starts immediately upon power-on
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Enable ZMK Mouse Keys
CONFIG_ZMK_POINTING=y
