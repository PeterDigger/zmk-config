# Enable ZMK USB HID Keyboard Functionality
CONFIG_ZMK_USB=y

# Disable CDC ACM Serial Logging (Prevents boot stalls when no serial console is attached)
CONFIG_USB_CDC_ACM=n

# Disable Deep Sleep (Keeps USB PHY awake on SAMD21)
CONFIG_ZMK_SLEEP=n

# Enable Mouse Keys / Pointing
CONFIG_ZMK_POINTING=y

# Hardware Debounce Settings for Matrix Scanning
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Completely disable UART console to free D6/D7 for matrix scanning
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
