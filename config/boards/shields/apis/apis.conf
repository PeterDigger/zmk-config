# Enable ZMK USB HID Keyboard functionality
CONFIG_ZMK_USB=y

# Disable CDC ACM serial logging (Prevents boot stalls when no serial console is attached)
CONFIG_USB_CDC_ACM=n

# Disable deep sleep to keep the USB PHY awake
CONFIG_ZMK_SLEEP=n

# Enable ZMK Mouse Keys
CONFIG_ZMK_POINTING=y

# Force USB device driver initialization to run early
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# Give the hardware USB PHY time to negotiate power before scanning matrix
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Keep power state active to prevent cold-boot USB PHY sleep
CONFIG_PM_DEVICE=n
